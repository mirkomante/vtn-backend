# ===========================================
# CLOUD BUILD CONFIGURATION - VIETNAMONAMOUR
# ===========================================

steps:
  # Step 1: Build dell'immagine Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/vtn-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/vtn-backend:latest'
      - '.'
    timeout: '1200s'

  # Step 2: Push dell'immagine su Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/vtn-backend:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/vtn-backend:latest'

  # Step 3: Deploy su Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'vtn-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/vtn-backend:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--concurrency'
      - '80'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'NODE_ENV=production,PORT=8080'
      - '--set-secrets'
      - 'DATABASE_URL=vtn-database-url:latest,SESSION_SECRET=vtn-session-secret:latest,GOOGLE_CLIENT_ID=vtn-google-client-id:latest,GOOGLE_CLIENT_SECRET=vtn-google-client-secret:latest'
      - '--add-cloudsql-instances'
      - '$PROJECT_ID:europe-west1:vtn-postgres'

# Configurazioni aggiuntive
options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

# Timeout totale del build
timeout: '1800s'

# Sostituzioni per variabili dinamiche
substitutions:
  _SERVICE_NAME: 'vtn-backend'
  _REGION: 'europe-west1'
  _MEMORY: '1Gi'
  _CPU: '1'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '10'
